# The app's checks: build, unit and QML tests, the app against the fake server and qmllint on Linux;
# the same tests again under ASan, UBSan and LSan; build and tests on Windows, where the Q_OS_WIN
# side is compiled. release.yml calls this too and publishes only when it passes.
#
# A commit that only touches docs or packaging builds nothing here.
name: ci

on:
  push:
    branches: [main]
    paths:
      - src/**
      - qml/**
      - tests/**
      - shaders/**
      - icons/**
      - CMakeLists.txt
      - CMakePresets.json
      - scripts/install-qt.sh
      - scripts/fake-subsonic.py
      - packaging/fetch-libmpv.sh
      - packaging/build-qtkeychain.sh
      - .github/workflows/ci.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Named, not latest: the runner's libmpv is the oldest one the tests cover.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # libmpv and QtKeychain are the system's (docs/architecture.md); D-Bus runs the MPRIS test,
      # Xvfb, Mesa and the xcb libraries of Qt's xcb plugin the app test.
      - name: build dependencies
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/99legato-retries >/dev/null
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ccache mold \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libmpv-dev qtkeychain-qt6-dev dbus xvfb libgl1-mesa-dri \
            libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1
      # Not when release.yml calls this: a release restores no cache (see there).
      - uses: actions/cache@v6
        if: github.workflow == 'ci'
        with:
          path: ~/.cache/legato/qt
          key: qt-${{ hashFiles('scripts/install-qt.sh') }}
      - uses: actions/cache@v6
        if: github.workflow == 'ci'
        with:
          path: ~/.cache/ccache
          key: ccache-dev-${{ github.sha }}
          restore-keys: ccache-dev-
      - name: qt
        run: |
          [ -d ~/.cache/legato/qt/6.12.0 ] || scripts/install-qt.sh
          echo "CMAKE_PREFIX_PATH=$HOME/.cache/legato/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      # Settings and caches of test runs stay out of the runner's home.
      - run: ctest --test-dir build/dev --output-on-failure
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
      - run: cmake --build build/dev --target all_qmllint

  # The tests built with AddressSanitizer and UndefinedBehaviorSanitizer, leaks checked at exit: use
  # after free, overflows and memory nothing points to, which a reading misses
  # (docs/decisions/0002-performance.md). The app test is the run that reaches the library, the
  # pages and the player. What is not ours is in tests/sanitizers/. A job of its own, so the linux
  # job's run stays as long as it was.
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: build dependencies
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/99legato-retries >/dev/null
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ccache mold \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libmpv-dev qtkeychain-qt6-dev dbus xvfb libgl1-mesa-dri \
            libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1
      - uses: actions/cache@v6
        if: github.workflow == 'ci'
        with:
          path: ~/.cache/legato/qt
          key: qt-${{ hashFiles('scripts/install-qt.sh') }}
      # Objects of their own: a sanitized object is not the dev build's.
      - uses: actions/cache@v6
        if: github.workflow == 'ci'
        with:
          path: ~/.cache/ccache
          key: ccache-sanitize-${{ github.sha }}
          restore-keys: ccache-sanitize-
      - name: qt
        run: |
          [ -d ~/.cache/legato/qt/6.12.0 ] || scripts/install-qt.sh
          echo "CMAKE_PREFIX_PATH=$HOME/.cache/legato/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"
      - run: cmake --preset sanitize
      - run: cmake --build --preset sanitize
      - name: test
        run: |
          set -o pipefail
          ctest --test-dir build/sanitize --output-on-failure 2>&1 | tee test.log
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
      # As on Windows: annotations are public, the log is not. One per failed test, from the
      # sanitizer's report on, or the end of its output.
      - name: failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("test.log")
          if log.exists():
              failed = {}
              name = None
              for line in log.read_text(encoding="utf-8", errors="replace").splitlines():
                  result = re.match(r"\s*\d+/\d+ Test +#\d+: (\S+) \.+(\*\*\*)?", line)
                  if result:
                      name = result[1] if result[2] else None
                      if name:
                          failed[name] = []
                  elif re.match(r"\s+Start +\d+:|\d+% tests passed", line):
                      name = None
                  elif name:
                      failed[name].append(line)
              for name, lines in failed.items():
                  marks = [i for i, line in enumerate(lines) if re.search(r"ERROR: |runtime error|FAIL!", line)]
                  start = max(0, marks[0] - 5) if marks else max(0, len(lines) - 80)
                  message = "\n".join(lines[start:start + 120])[-15000:]
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Sanitizers {name}::{message}")
          PY

  # A Release build, as the installer is, with the release's Qt, libmpv and QtKeychain.
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    # Git Bash, as build-windows.sh runs in.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: qt
        run: |
          dir=$(cygpath -u "$RUNNER_TEMP")/qt
          qt=$(scripts/install-qt.sh "$dir")
          for path in "$qt/bin" "$dir/Tools/mingw1310_64/bin" "$dir/Tools/Ninja"; do
            cygpath -w "$path"
          done >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(cygpath -m "$qt")" >> "$GITHUB_ENV"
      - name: libmpv and qtkeychain
        run: |
          packaging/fetch-libmpv.sh dist/mpv
          packaging/build-qtkeychain.sh dist/qtkeychain
          cygpath -w "$PWD/dist/mpv" >> "$GITHUB_PATH"
          cygpath -w "$PWD/dist/qtkeychain/bin" >> "$GITHUB_PATH"
      - name: configure
        run: |
          set -o pipefail
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMPV_DIR="$(cygpath -m "$PWD/dist/mpv")" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH;$(cygpath -m "$PWD/dist/qtkeychain")" 2>&1 | tee configure.log
      - name: build
        run: |
          set -o pipefail
          cmake --build build/ci 2>&1 | tee build.log
      - name: test
        run: |
          set -o pipefail
          ctest --test-dir build/ci --output-on-failure 2>&1 | tee test.log
      # The full log needs a GitHub login; annotations are public, so a failure stays readable.
      - name: failure details
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("configure.log", "build.log", "test.log"):
              log = Path(name)
              if not log.exists():
                  continue
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              errors = [i for i, line in enumerate(lines) if "error" in line.lower()]
              start = max(0, errors[0] - 5) if errors else max(0, len(lines) - 80)
              text = "\n".join(lines[start:start + 120])[-15000:]
              message = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Windows {name}::{message}")
          PY
