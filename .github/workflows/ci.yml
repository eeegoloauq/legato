# The app's checks: build, unit and QML tests and qmllint on Linux, build and tests on Windows, where
# the Q_OS_WIN side is compiled. release.yml calls this too and publishes only when it passes.
#
# A commit that only touches docs or packaging builds nothing here.
name: ci

on:
  push:
    branches: [main]
    paths:
      - src/**
      - qml/**
      - tests/**
      - shaders/**
      - icons/**
      - CMakeLists.txt
      - CMakePresets.json
      - scripts/install-qt.sh
      - packaging/fetch-libmpv.sh
      - packaging/build-qtkeychain.sh
      - .github/workflows/ci.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Named, not latest: the runner's libmpv is the oldest one the tests cover.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # libmpv and QtKeychain are the system's (docs/architecture.md); D-Bus runs the MPRIS test.
      - name: build dependencies
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/99legato-retries >/dev/null
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ccache mold \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libmpv-dev qtkeychain-qt6-dev dbus
      # Not when release.yml calls this: a release restores no cache (see there).
      - uses: actions/cache@v6
        if: github.workflow == 'ci'
        with:
          path: ~/.cache/legato/qt
          key: qt-${{ hashFiles('scripts/install-qt.sh') }}
      - uses: actions/cache@v6
        if: github.workflow == 'ci'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - name: qt
        run: |
          [ -d ~/.cache/legato/qt/6.12.0 ] || scripts/install-qt.sh
          echo "CMAKE_PREFIX_PATH=$HOME/.cache/legato/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      # Settings and caches of test runs stay out of the runner's home.
      - run: ctest --test-dir build/dev --output-on-failure
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
      - run: cmake --build build/dev --target all_qmllint

  # A Release build, as the installer is, with the release's Qt, libmpv and QtKeychain.
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    # Git Bash, as build-windows.sh runs in.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: qt
        run: |
          dir=$(cygpath -u "$RUNNER_TEMP")/qt
          qt=$(scripts/install-qt.sh "$dir")
          for path in "$qt/bin" "$dir/Tools/mingw1310_64/bin" "$dir/Tools/Ninja"; do
            cygpath -w "$path"
          done >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(cygpath -m "$qt")" >> "$GITHUB_ENV"
      - name: libmpv and qtkeychain
        run: |
          packaging/fetch-libmpv.sh dist/mpv
          packaging/build-qtkeychain.sh dist/qtkeychain
          cygpath -w "$PWD/dist/mpv" >> "$GITHUB_PATH"
          cygpath -w "$PWD/dist/qtkeychain/bin" >> "$GITHUB_PATH"
      - run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMPV_DIR="$(cygpath -m "$PWD/dist/mpv")" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH;$(cygpath -m "$PWD/dist/qtkeychain")"
      - run: cmake --build build/ci
      - run: ctest --test-dir build/ci --output-on-failure
